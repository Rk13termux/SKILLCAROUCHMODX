<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .titulo { font-weight: 700; }
  .cuerpo { font-weight: 400; }
  .dato { font-weight: 700; color: var(--acento); }
  .resaltar { font-weight: 700; }
  .cita { font-style: italic; }
  .clave { font-weight: 700; color: #FFB800; }
</style>
</head>
<body>
  <div class="numero">4/7</div>
  <div class="slide">
    <div class="contenido">
      <div class="titulo">Un prompt que funciona</div>
      <div class="cuerpo">Rol, <span class="clave">contexto</span>, tarea y formato. Cuatro bloques y el resultado cambia por completo.</div>
      <div class="componente" data-component="code" data-props='{"lenguaje": "generic", "titulo": "prompt", "codigo": "Rol: revisor de código\nContexto: repo Python, equipo de 3\nTarea: señala riesgos, no estilo\nFormato: lista priorizada", "notas": "Cuatro bloques: rol, contexto, tarea, formato."}'></div>
    </div>
    <div class="pie">
      <span class="logo"></span>TechEdu · Prompts IA
    </div>
  </div>
</body>
</html>
